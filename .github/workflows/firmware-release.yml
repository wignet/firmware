name: Firmware download

on:
  pull_request:
    paths: ["esp32/**", ".github/workflows/firmware-release.yml"]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `ota: true` is the list of OTA boards: the release also carries
        # wignet-<environment>-app.bin, which the server imports and offers
        # over the air once the release is published. A board joins it only
        # after its bench (docs/ota_bench.md) and with ota1 declared.
        include:
          - environment: waveshare_driver_75v2
            ota: true
          - environment: waveshare_photopainter_73e6
            ota: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build a clean first-install image
        working-directory: esp32
        env:
          FIRMWARE_ENVIRONMENT: ${{ matrix.environment }}
          WIGNET_RELEASE_APP: ${{ matrix.ota && '1' || '' }}
        run: |
          cp src/config.h.example src/config.h
          pio run -e "$FIRMWARE_ENVIRONMENT" -t release
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: esp32/.pio/release/${{ matrix.environment }}/*
          if-no-files-found: error

  # The HDMI TV's Buildroot image (raspberry-tv/README.md): the SD card for a
  # first install, and the root filesystem the server offers over the air
  # (wignet-raspberry_pi_hdmi-rootfs.ext4.xz, docs/ota.md "Raspberry Pi
  # profile" on the server). About an hour: only for tags and by hand.
  tv:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      BUILDROOT_TAG: "2026.02.3"
      BUILDROOT_COMMIT: 679b9ead7620bbf193620d1ebf56f53c1764d37a
      BR2_DL_DIR: ${{ github.workspace }}/../buildroot-dl
      OUT: ${{ github.workspace }}/../buildroot-output
    steps:
      - uses: actions/checkout@v4
      - name: Install Buildroot's host tools
        run: sudo apt-get update && sudo apt-get install -y bc cpio rsync unzip file e2fsprogs
      - name: Fetch Buildroot ${{ env.BUILDROOT_TAG }}
        run: |
          git clone --depth 1 --branch "$BUILDROOT_TAG" https://gitlab.com/buildroot.org/buildroot.git ../buildroot
          test "$(git -C ../buildroot rev-parse HEAD)" = "$BUILDROOT_COMMIT"
      - uses: actions/cache@v4
        with:
          path: ${{ env.BR2_DL_DIR }}
          key: buildroot-dl-${{ env.BUILDROOT_TAG }}-${{ hashFiles('raspberry-tv/buildroot/configs/*', 'raspberry-tv/buildroot/package/**') }}
          restore-keys: buildroot-dl-${{ env.BUILDROOT_TAG }}-
      - name: Build the image
        run: |
          make -C ../buildroot O="$OUT" BR2_EXTERNAL="$PWD/raspberry-tv/buildroot" wignet_tv_pi0w_defconfig
          make -C ../buildroot O="$OUT"
      # What the server would refuse, or what an owner must never receive.
      - name: Check the image
        run: |
          rootfs="$OUT/images/rootfs.ext4"
          version=$(debugfs -R "cat /usr/local/lib/wignet-tv/VERSION" "$rootfs")
          echo "fw=$version"
          [[ "$version" =~ ^[0-9a-f]{12}$ ]] || { echo "::error::not a clean build: $version"; exit 1; }
          if dumpe2fs -h "$rootfs" | grep -q '^Filesystem features:.*has_journal'; then
            echo "::error::the root ext4 has a journal: its slot would never hash to its image"; exit 1
          fi
          debugfs -R "cat /etc/wignet-tv.conf" "$rootfs" | grep -qx 'WIGNET_TV_OTA=ab'
          if debugfs -R "stat /root/.ssh/authorized_keys" "$rootfs" 2>/dev/null | grep -q Inode; then
            echo "::error::a development SSH key is in the image"; exit 1
          fi
      - name: Name and hash the images
        run: |
          mkdir release
          xz -T0 -6 -c "$OUT/images/rootfs.ext4" > release/wignet-raspberry_pi_hdmi-rootfs.ext4.xz
          xz -T0 -6 -c "$OUT/images/sdcard.img" > release/wignet-raspberry_pi_hdmi-sdcard.img.xz
          (cd release && sha256sum wignet-raspberry_pi_hdmi-* > raspberry_pi_hdmi-SHA256SUMS)
          cat release/raspberry_pi_hdmi-SHA256SUMS
          ls -l release
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-raspberry_pi_hdmi
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: firmware
      # The notes are what owners read on their frame's page when the server
      # offers this release: the version's changelog, not the flashing guide.
      - name: Prepare a draft release for hardware validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          changelog="docs/changelog/$RELEASE_TAG.md"
          if [ ! -s "$changelog" ]; then
            echo "::error::$changelog is missing: write what changed for owners"
            exit 1
          fi
          { cat "$changelog"
            printf '\nInstall over USB: https://github.com/%s/blob/%s/docs/flashing.md\n' \
              "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          } > notes.md
          cat firmware/*-SHA256SUMS > firmware/SHA256SUMS
          gh release create "$RELEASE_TAG" firmware/* \
            --verify-tag --draft --title "Wignet firmware $RELEASE_TAG" \
            --notes-file notes.md
