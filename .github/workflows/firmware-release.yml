name: Firmware download

on:
  pull_request:
    paths: ["esp32/**", ".github/workflows/firmware-release.yml"]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build a clean first-install image
        working-directory: esp32
        run: |
          cp src/config.h.example src/config.h
          pio run -e waveshare_driver_75v2 -t release
      - uses: actions/upload-artifact@v4
        with:
          name: waveshare-driver-75v2
          path: esp32/.pio/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: waveshare-driver-75v2
          path: firmware
      - name: Prepare a draft release for hardware validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" firmware/* \
            --verify-tag --draft --title "Wignet firmware $RELEASE_TAG" \
            --notes-file docs/flashing.md
