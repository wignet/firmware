name: Firmware download

on:
  pull_request:
    paths: ["esp32/**", ".github/workflows/firmware-release.yml"]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `ota: true` is the list of OTA boards: the release also carries
        # wignet-<environment>-app.bin, which the server imports and offers
        # over the air once the release is published. A board joins it only
        # after its bench (docs/ota_bench.md) and with ota1 declared.
        include:
          - environment: waveshare_driver_75v2
          - environment: waveshare_photopainter_73e6
            ota: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build a clean first-install image
        working-directory: esp32
        env:
          FIRMWARE_ENVIRONMENT: ${{ matrix.environment }}
          WIGNET_RELEASE_APP: ${{ matrix.ota && '1' || '' }}
        run: |
          cp src/config.h.example src/config.h
          pio run -e "$FIRMWARE_ENVIRONMENT" -t release
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: esp32/.pio/release/${{ matrix.environment }}/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: firmware
      # The notes are what owners read on their frame's page when the server
      # offers this release: the version's changelog, not the flashing guide.
      - name: Prepare a draft release for hardware validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          changelog="docs/changelog/$RELEASE_TAG.md"
          if [ ! -s "$changelog" ]; then
            echo "::error::$changelog is missing: write what changed for owners"
            exit 1
          fi
          { cat "$changelog"
            printf '\nInstall over USB: https://github.com/%s/blob/%s/docs/flashing.md\n' \
              "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          } > notes.md
          cat firmware/*-SHA256SUMS > firmware/SHA256SUMS
          gh release create "$RELEASE_TAG" firmware/* \
            --verify-tag --draft --title "Wignet firmware $RELEASE_TAG" \
            --notes-file notes.md
