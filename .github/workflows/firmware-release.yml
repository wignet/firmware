name: Firmware download

on:
  pull_request:
    paths: ["esp32/**", "raspberry-tv/**", ".github/workflows/firmware-release.yml"]
  push:
    tags: ["*/v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # On a target tag, build only that target. Pull requests and a manual
    # dispatch still build the ESP32 targets for validation.
    if: github.event_name != 'push' || startsWith(github.ref_name, format('{0}/', matrix.release_target))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `ota: true` is the list of OTA boards: the release also carries
        # wignet-<environment>-app.bin, which the server imports and offers
        # over the air once the release is published. A board joins it only
        # after its bench (docs/ota_bench.md) and with ota1 declared.
        include:
          - environment: waveshare_driver_75v2
            ota: true
            release_target: driver-75v2
          - environment: waveshare_photopainter_73e6
            ota: true
            release_target: photopainter-73e6
          # First-install image only until the AMOLED has an OTA bench.
          - environment: waveshare_esp32s3_amoled_18
            ota: false
            release_target: amoled-18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Check target build inputs
        id: scope
        env:
          RELEASE_TARGET: ${{ matrix.release_target }}
          RELEASE_TAG: ${{ github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=0
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            changed=1
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            previous=$(git tag --list "$RELEASE_TARGET/v*" --sort=-version:refname | grep -Fxv "$RELEASE_TAG" | head -n 1 || true)
            if [ -z "$previous" ]; then
              previous=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
            fi
            [ -z "$previous" ] && changed=1 || { base="$previous"; head="$RELEASE_TAG"; }
          else
            base="$BASE_SHA"
            head="$HEAD_SHA"
          fi
          if [ -n "${base:-}" ]; then
            result=$(python3 esp32/target_inputs.py "$RELEASE_TARGET" "$base" "$head")
            [ "$result" = changed ] && changed=1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$changed" = 0 ]; then
            echo "::error::no build inputs changed for $RELEASE_TARGET since $previous"
            exit 1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Build a clean first-install image
        if: steps.scope.outputs.changed == '1'
        working-directory: esp32
        env:
          FIRMWARE_ENVIRONMENT: ${{ matrix.environment }}
          WIGNET_RELEASE_APP: ${{ matrix.ota && '1' || '' }}
        run: |
          cp src/config.h.example src/config.h
          pio run -e "$FIRMWARE_ENVIRONMENT" -t release
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.changed == '1'
        with:
          name: firmware-${{ matrix.environment }}
          path: esp32/.pio/release/${{ matrix.environment }}/*
          if-no-files-found: error

  # The HDMI TV's Buildroot image (raspberry-tv/README.md): the SD card for a
  # first install, and the root filesystem the server offers over the air
  # (wignet-raspberry_pi_hdmi-rootfs.ext4.xz, docs/ota.md "Raspberry Pi
  # profile" on the server). About an hour: only for tags and by hand.
  tv:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'tv-pi0w/')
    runs-on: ubuntu-latest
    env:
      BUILDROOT_TAG: "2026.02.3"
      BUILDROOT_COMMIT: 679b9ead7620bbf193620d1ebf56f53c1764d37a
      BR2_DL_DIR: ${{ github.workspace }}/../buildroot-dl
      OUT: ${{ github.workspace }}/../buildroot-output
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check target build inputs
        id: scope
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=0
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            previous=$(git tag --list 'tv-pi0w/v*' --sort=-version:refname | grep -Fxv "$RELEASE_TAG" | head -n 1 || true)
            if [ -z "$previous" ]; then
              previous=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
            fi
            if [ -z "$previous" ]; then
              changed=1
            else
              base="$previous"
              head="$RELEASE_TAG"
            fi
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="$BASE_SHA"
            head="$HEAD_SHA"
          else
            changed=1
          fi
          if [ -n "${base:-}" ]; then
            result=$(python3 esp32/target_inputs.py tv-pi0w "$base" "$head")
            [ "$result" = changed ] && changed=1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$changed" = 0 ]; then
            echo "::error::no build inputs changed for tv-pi0w since $previous"
            exit 1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Install Buildroot's host tools
        if: steps.scope.outputs.changed == '1'
        run: sudo apt-get update && sudo apt-get install -y bc cpio rsync unzip file e2fsprogs
      - name: Fetch Buildroot ${{ env.BUILDROOT_TAG }}
        if: steps.scope.outputs.changed == '1'
        run: |
          git clone --depth 1 --branch "$BUILDROOT_TAG" https://gitlab.com/buildroot.org/buildroot.git ../buildroot
          test "$(git -C ../buildroot rev-parse HEAD)" = "$BUILDROOT_COMMIT"
      - uses: actions/cache@v4
        if: steps.scope.outputs.changed == '1'
        with:
          path: ${{ env.BR2_DL_DIR }}
          key: buildroot-dl-${{ env.BUILDROOT_TAG }}-${{ hashFiles('raspberry-tv/buildroot/configs/*', 'raspberry-tv/buildroot/package/**') }}
          restore-keys: buildroot-dl-${{ env.BUILDROOT_TAG }}-
      - name: Build the image
        if: steps.scope.outputs.changed == '1'
        run: |
          make -C ../buildroot O="$OUT" BR2_EXTERNAL="$PWD/raspberry-tv/buildroot" wignet_tv_pi0w_defconfig
          make -C ../buildroot O="$OUT"
      # What the server would refuse, or what an owner must never receive.
      - name: Check the image
        if: steps.scope.outputs.changed == '1'
        run: |
          rootfs="$OUT/images/rootfs.ext4"
          version=$(debugfs -R "cat /usr/local/lib/wignet-tv/VERSION" "$rootfs")
          echo "fw=$version"
          [[ "$version" =~ ^[0-9a-f]{12}$ ]] || { echo "::error::not a clean build: $version"; exit 1; }
          if dumpe2fs -h "$rootfs" | grep -q '^Filesystem features:.*has_journal'; then
            echo "::error::the root ext4 has a journal: its slot would never hash to its image"; exit 1
          fi
          debugfs -R "cat /etc/wignet-tv.conf" "$rootfs" | grep -qx 'WIGNET_TV_OTA=ab'
          if debugfs -R "stat /root/.ssh/authorized_keys" "$rootfs" 2>/dev/null | grep -q Inode; then
            echo "::error::a development SSH key is in the image"; exit 1
          fi
      - name: Name and hash the images
        if: steps.scope.outputs.changed == '1'
        run: |
          mkdir release
          xz -T0 -6 -c "$OUT/images/rootfs.ext4" > release/wignet-raspberry_pi_hdmi-rootfs.ext4.xz
          xz -T0 -6 -c "$OUT/images/sdcard.img" > release/wignet-raspberry_pi_hdmi-sdcard.img.xz
          (cd release && sha256sum wignet-raspberry_pi_hdmi-* > raspberry_pi_hdmi-SHA256SUMS)
          cat release/raspberry_pi_hdmi-SHA256SUMS
          ls -l release
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.changed == '1'
        with:
          name: firmware-raspberry_pi_hdmi
          path: release/*
          if-no-files-found: error

  release:
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.tv.result == 'success' || needs.tv.result == 'skipped')
    needs: [build, tv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: firmware
      # The notes are what owners read on their frame's page when the server
      # offers this release: the version's changelog, not the flashing guide.
      - name: Prepare a draft release for hardware validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          changelog="docs/changelog/$RELEASE_TAG.md"
          if [ ! -s "$changelog" ]; then
            echo "::error::$changelog is missing: write what changed for owners"
            exit 1
          fi
          target="${RELEASE_TAG%%/*}"
          case "$target" in
            driver-75v2) expected="wignet-waveshare_driver_75v2-app.bin"; prefix="wignet-waveshare_driver_75v2-" ;;
            photopainter-73e6) expected="wignet-waveshare_photopainter_73e6-app.bin"; prefix="wignet-waveshare_photopainter_73e6-" ;;
            amoled-18) expected="wignet-waveshare_esp32s3_amoled_18-factory.bin"; prefix="wignet-waveshare_esp32s3_amoled_18-" ;;
            tv-pi0w) expected="wignet-raspberry_pi_hdmi-rootfs.ext4.xz"; prefix="wignet-raspberry_pi_hdmi-" ;;
            *) echo "::error::unknown release target in $RELEASE_TAG"; exit 1 ;;
          esac
          if ! compgen -G "firmware/$expected" >/dev/null; then
            echo "::error::target $target did not produce $expected"
            exit 1
          fi
          for file in firmware/wignet-*; do
            [ -e "$file" ] || continue
            case "${file#firmware/}" in
              "$prefix"*) ;;
              *) echo "::error::release contains an image for a different target: ${file#firmware/}"; exit 1 ;;
            esac
          done
          { cat "$changelog"
            printf '\nInstall over USB: https://github.com/%s/blob/%s/docs/flashing.md\n' \
              "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          } > notes.md
          cat firmware/*-SHA256SUMS > firmware/SHA256SUMS
          gh release create "$RELEASE_TAG" firmware/* \
            --verify-tag --draft --title "Wignet firmware $RELEASE_TAG" \
            --notes-file notes.md
