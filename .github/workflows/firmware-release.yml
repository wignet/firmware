name: Firmware download

on:
  pull_request:
    paths: ["esp32/**", ".github/workflows/firmware-release.yml"]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ota-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check OTA compatibility policy and packaging
        working-directory: esp32
        run: |
          python -m unittest discover -s tests -p 'test_ota*.py'
          c++ -std=c++11 -Wall -Wextra -Werror -Isrc tests/ota_image_test.cpp -o /tmp/ota-image-test
          /tmp/ota-image-test
      - name: Compile experimental OTA and rollback fault image
        working-directory: esp32
        run: |
          python -m pip install platformio==6.2.0
          cp src/config.h.example src/config.h
          pio run -e waveshare_driver_75v2_ota -e waveshare_driver_75v2_ota_reject
          python tests/check_ota_build.py .pio/build/waveshare_driver_75v2_ota
          python tests/check_ota_build.py .pio/build/waveshare_driver_75v2_ota_reject
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-75v2-ota-bench
          path: esp32/.pio/ota/*/*
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build a clean first-install image
        working-directory: esp32
        run: |
          cp src/config.h.example src/config.h
          pio run -e waveshare_driver_75v2 -t release
      - uses: actions/upload-artifact@v4
        with:
          name: waveshare-driver-75v2
          path: esp32/.pio/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: waveshare-driver-75v2
          path: firmware
      - name: Prepare a draft release for hardware validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" firmware/* \
            --verify-tag --draft --title "Wignet firmware $RELEASE_TAG" \
            --notes-file docs/flashing.md
