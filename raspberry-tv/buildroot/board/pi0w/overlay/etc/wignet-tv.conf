# The client declares itself to Wignet (full colour, screen size): nothing to
# set up on the server.  Unset, the size is the HDMI mode's.
WIGNET_HOST=https://api.wignet.app
WIGNET_CEC=on
WIGNET_SOUND=on
WIGNET_STATE_DIR=/data/wignet-tv
# No NetworkManager in this image: wpa_supplicant, hostapd and dnsmasq.
WIGNET_WIFI_BACKEND=wpa
WIGNET_WIFI_DIR=/data/wifi
WIGNET_WIFI_COUNTRY=FR
WIGNET_SETUP_LOG=/data/wignet-tv/setup.log
PYTHONDONTWRITEBYTECODE=1
# Over-the-air updates into the other root slot (tv_ota.py).
WIGNET_TV_OTA=ab
