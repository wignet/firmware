# boot | rootfs A | rootfs B (reserved for A/B updates) | data (read-write)
image boot.vfat {
	vfat {
		files = {
#BOOT_FILES#
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "wignet-data"
		use-mke2fs = true
	}
	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfsA {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 384M
	}

	partition rootfsB {
		partition-type = 0x83
		size = 384M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
