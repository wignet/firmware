; PlatformIO Configuration for Wignet ESP32 Client
; Supports multiple hardware targets via environments

[platformio]
; Default to the currently deployed Waveshare ESP32 Driver Board + 7.5" V2.
; Other supported displays remain available through `pio run -e <environment>`.
default_envs = waveshare_driver_75v2

; ============ Shared Configuration ============
[env]
; Keep clean CI/release builds on the platform validated on hardware.
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
extra_scripts =
    pre:embed_portal.py
    pre:firmware_version.py
    optimize_gxepd2.py
    post:release_image.py

; Shared libraries
lib_deps =
    zinggjm/GxEPD2@^1.6.9
    adafruit/Adafruit GFX Library@^1.11.9
    tzapu/WiFiManager@^2.0.17

; Common build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3

; ============ Waveshare ESP32-S3 PhotoPainter + 7.3" Spectra 6 ==========
; Integrated ESP32-S3-N16R8 board and 800x480 GDEP073E01/HT073A01 panel.
[env:waveshare_photopainter_73e6]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.filesystem = littlefs
upload_speed = 460800
; ArduinoJson: the /schedule list of sounds (alarm_clock_hal.cpp).
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    ${env.build_flags}
    -DTARGET_WAVESHARE_PHOTOPAINTER_73E6
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<*>
    -<hal/*>
    +<hal/waveshare_photopainter_73e6.cpp>

; ============ Waveshare ESP32-S3-LCD-1.54 ==========
; ESP32-S3R8 (16 MB flash, 8 MB octal PSRAM) and a 240x240 ST7789 colour LCD,
; with a QMI8658 accelerometer: the frame finds which edge is up itself
; (self_orient1). Full-colour PNGs over the rgb profile (docs/lcd_154.md).
; Plugged in for now: it never deep-sleeps, the battery comes later.
[env:waveshare_esp32s3_lcd_154]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
upload_speed = 921600
; The boot picture, assets/boot_lcd154.png -> src/boot_image.h.
extra_scripts =
    ${env.extra_scripts}
    pre:embed_boot_image.py
board_build.filesystem = littlefs
; ArduinoJson: the /schedule list of sounds (alarm_clock_hal.cpp).
; LVGL plays scenes (scene_player.cpp, docs/scenes.md); config in spike/lv_conf.h.
lib_deps =
    ${env.lib_deps}
    bitbank2/PNGdec@^1.1.0
    bblanchon/ArduinoJson@^7.2.1
    lvgl/lvgl@9.6.0
build_flags =
    ${env.build_flags}
    -DTARGET_WAVESHARE_ESP32S3_LCD_154
    ; scene_runtime.cpp: each float operation rounded as its reference does, none fused.
    -ffp-contract=off
    -DWIGNET_SCENES
    -DLV_CONF_INCLUDE_SIMPLE
    -Ispike
    -DWIGNET_DISPLAY_RGB
    -DWIGNET_HAS_IMU
    -DWIGNET_SELF_ORIENT
    -DWIGNET_ALWAYS_POWERED
    -DWIGNET_POWER_HOLD_PIN=2
    -DWIGNET_POWER_BUTTON_PIN=5
    -DWIGNET_BATTERY_ADC_PIN=1
    -DWIGNET_BATTERY_DIVIDER=3
    -DWIGNET_CHARGE_PIN=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<*>
    -<hal/*>
    +<hal/waveshare_esp32s3_lcd.cpp>

; ============ Waveshare ESP32-S3-LCD-2 ==========
; ESP32-S3R8 (16 MB flash, 8 MB octal PSRAM) and a 2" 240x320 ST7789 colour
; LCD, natively portrait: it declares its landscape buffer, 320x240, and the
; owner picks portrait or landscape on the platform like an e-paper Wignet.
; No speaker, no battery fitted: always awake (docs/lcd_2.md).
[env:waveshare_esp32s3_lcd_2]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
upload_speed = 921600
; The boot picture, assets/boot_lcd154.png -> src/boot_image.h.
extra_scripts =
    ${env.extra_scripts}
    pre:embed_boot_image.py
; ArduinoJson and LVGL: scenes, as on the 1.54" (scene_player.cpp,
; docs/scenes.md); config in spike/lv_conf.h.
lib_deps =
    ${env.lib_deps}
    bitbank2/PNGdec@^1.1.0
    bblanchon/ArduinoJson@^7.2.1
    lvgl/lvgl@9.6.0
build_flags =
    ${env.build_flags}
    -DTARGET_WAVESHARE_ESP32S3_LCD_2
    ; scene_runtime.cpp: each float operation rounded as its reference does, none fused.
    -ffp-contract=off
    -DWIGNET_SCENES
    -DLV_CONF_INCLUDE_SIMPLE
    -Ispike
    -DWIGNET_DISPLAY_RGB
    -DWIGNET_HAS_IMU
    -DWIGNET_ALWAYS_POWERED
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<*>
    -<hal/*>
    +<hal/waveshare_esp32s3_lcd.cpp>

; ============ Waveshare ESP32-S3-LCD-2, LVGL spike ==========
; Not for production (docs/lvgl_spike.md): the 2" board with LVGL 9.6 taking
; the panel, a sprite wandering over a background from a JSON scene. The
; plain env above plays scenes instead; everything here is behind WIGNET_LVGL_SPIKE.
; Pictures: spike/make_assets.py -> spike/*.bin, embedded as they are.
[env:waveshare_esp32s3_lcd_2_lvgl]
extends = env:waveshare_esp32s3_lcd_2
board_build.embed_files =
    spike/background.bin
    spike/walker.bin
; LVGL, ArduinoJson and lv_conf.h come with the 2" env (its scenes); the
; spike keeps the panel, so scene_player.h leaves the player off.
build_flags =
    ${env:waveshare_esp32s3_lcd_2.build_flags}
    -DWIGNET_LVGL_SPIKE

; ============ Waveshare ESP32-S3-LCD-1.54, LVGL spike ==========
; The same spike on the 1.54" board (240x240, BOOT, PLUS, PWR): its own
; 240x240 background; the wander area follows the screen size.
[env:waveshare_esp32s3_lcd_154_lvgl]
extends = env:waveshare_esp32s3_lcd_154
lib_deps =
    ${env:waveshare_esp32s3_lcd_154.lib_deps}
    lvgl/lvgl@9.6.0
board_build.embed_files =
    spike/background_240.bin
    spike/walker.bin
build_flags =
    ${env:waveshare_esp32s3_lcd_154.build_flags}
    -DWIGNET_LVGL_SPIKE
    -DWIGNET_LVGL_BG_240
    -DLV_CONF_INCLUDE_SIMPLE
    -Ispike

; ============ Waveshare ePaper ESP32 Driver Board ============
; Target: Waveshare Universal e-Paper Driver Board
; Display: 7.5" V2 (800x480)
[env:waveshare_driver_75v2]
board = esp32dev
upload_speed = 115200
build_flags =
    ${env.build_flags}
    -DTARGET_WAVESHARE_DRIVER_75V2
build_src_filter = 
    +<*>
    -<hal/*>
    +<hal/waveshare_driver_75v2.cpp>

; Same hardware, but clears saved WiFi credentials once for this firmware build.
; Use this to test the first-install captive portal flow.
[env:waveshare_driver_75v2_clear_wifi]
extends = env:waveshare_driver_75v2
build_flags =
    ${env:waveshare_driver_75v2.build_flags}
    -DWIGNET_CLEAR_WIFI_ON_FIRST_BOOT

; More explicit alias for the first-install test firmware.
[env:waveshare_driver_75v2_no_default_wifi]
extends = env:waveshare_driver_75v2_clear_wifi

; ============ DFRobot FireBeetle ESP32 ============
; Target: DFRobot FireBeetle ESP32
; Display: 7.5" V2 (800x480)
[env:firebeetle_75v2]
board = firebeetle32
board_build.flash_mode = dio
build_flags =
    ${env.build_flags}
    -DTARGET_FIREBEETLE_75V2
build_src_filter = 
    +<*>
    -<hal/*>
    +<hal/firebeetle_75v2.cpp>

; ============ Wemos/Lolin D1 mini ESP8266 ============
; Target: D1 mini / ESP8266 + Waveshare e-Paper HAT
; Display: 7.5" V2 (800x480)
[env:d1_mini_75v2]
platform = espressif8266
board = d1_mini
framework = arduino
upload_speed = 115200
upload_resetmethod = none
board_build.flash_mode = dout
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DTARGET_D1_MINI_75V2
build_src_filter =
    +<*>
    -<hal/*>
    +<hal/d1_mini_75v2.cpp>

